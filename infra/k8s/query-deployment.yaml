apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service-java
  namespace: surgical-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service-java
  template:
    metadata:
      labels:
        app: query-service-java
    spec:
      containers:
        - name: query-service-java
          image: ghcr.io/mohosy/query-service-java:latest
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: query-service-java
  namespace: surgical-data
spec:
  selector:
    app: query-service-java
  ports:
    - port: 80
      targetPort: 8082
