version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"

  spark:
    image: bitnami/spark:3.5
    command: ["/opt/bitnami/spark/bin/spark-shell"]
    ports:
      - "4040:4040"

  ingest-service:
    build:
      context: ./services/ingest-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: surgical.telemetry.raw
    depends_on:
      - kafka
    ports:
      - "8080:8080"

  indexer-service:
    build:
      context: ./services/indexer-service
    environment:
      TIMELINE_BACKEND: cassandra
      SEARCH_BACKEND: elasticsearch
      DOCS_BACKEND: mongodb
    depends_on:
      - cassandra
      - elasticsearch
      - mongodb
    ports:
      - "8081:8081"

  query-service-java:
    build:
      context: ./services/query-service-java
    ports:
      - "8082:8082"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ingest-service
      - indexer-service
